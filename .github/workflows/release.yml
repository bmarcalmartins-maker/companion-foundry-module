name: Release

# Empacota o módulo e publica um GitHub release a cada tag de versão (ex.: v1.0.0).
# Os assets module.json + module.zip ficam acessíveis via:
#   .../releases/latest/download/module.json   (manifest)
#   .../releases/latest/download/module.zip     (download)
# que são exatamente as URLs que o module.json já aponta.

on:
  push:
    tags:
      - "v*"
  # Saída manual: quando não dá pra empurrar a tag (proxy de git que recusa
  # push de tag, por exemplo), dispara por aqui informando a versão. O release
  # cria a tag a partir do commit em que o workflow rodar.
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar, com o v (ex.: v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derivar versão da tag
        id: version
        # Tira o 'v' e tolera um ponto sobrando (tag 'v.1.2.0' → '1.2.0'), pra um
        # erro de digitação na tag não gerar version inválida no module.json (o
        # Foundry rejeita e não oferece o update).
        # No disparo manual a origem é o input; no push de tag, o próprio ref.
        env:
          ENTRADA: ${{ inputs.version }}
        run: |
          TAG="${ENTRADA:-$GITHUB_REF_NAME}"
          V="${TAG#v}"
          V="${V#.}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publicando $TAG (version $V)"

      - name: Gravar a versão no module.json
        # Mantém a versão do manifesto igual à tag, pra detecção de update do Foundry.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            m.version = process.env.VERSION;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
          '

      - name: Montar module.zip
        # module.json fica na raiz do zip (formato esperado pelo instalador do Foundry).
        run: |
          zip -r module.zip \
            module.json \
            scripts \
            styles \
            languages \
            README.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          # tag_name explícito: no disparo manual não existe ref de tag, e é ele
          # que faz o release criar a tag a partir deste commit.
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
