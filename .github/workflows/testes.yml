name: Testes

# As regras puras do módulo e a cola com um Foundry falso (npm test). Sem
# dependência nem build: o Node 22 roda os testes direto.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
